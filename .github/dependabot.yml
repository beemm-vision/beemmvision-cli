# BV-590 — même schéma que beemm-vision-core (BV-567) :
# - npm : correctifs et mineurs groupés en UNE PR par semaine ; les majeures
#   sont ignorées ici (l'audit hebdo de la stack, BV-586, les signale dans
#   Plane, avec un audit de migration avant tout code).
# - Les alertes de sécurité restent signalées à part par Dependabot.
# - Pas d'auto-merge : une PR Dependabot se relit et se merge comme les autres.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      npm-mineurs-et-correctifs:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
